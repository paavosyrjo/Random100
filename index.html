<!DOCTYPE html><html lang="fi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#2563eb"><title>Satunnaisluku 0–100</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{width:90%;max-width:400px;background:white;border-radius:20px;padding:30px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.15)}.result{font-size:80px;font-weight:bold;color:#2563eb;margin:30px 0}button{width:100%;padding:16px;border:none;border-radius:12px;background:#2563eb;color:#fff;font-size:18px;font-weight:bold}</style></head><body><div class="card"><h1>Satunnaisluku 0–100</h1><div id="result" class="result">?</div><button onclick="drawNumber()">Arvo luku</button></div><script>function drawNumber(){document.getElementById('result').textContent=Math.floor(Math.random()*101)} if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));}</script></body></html>
